        <h2>安装提示</h2>
        <ul>
          <li>在应用内进入：<code>设置 → 创意工坊</code>。</li>
          <li>选择“本地安装”或填写可访问的 Git 仓库地址进行安装。</li>
          <li>插件会被安装到当前 Vault 的 <code>.zhixu/plugins/&lt;pluginId&gt;/</code>。</li>
        </ul>
        <p>开发文档：<a href="../docs/plugins/">插件开发指南</a></p>
