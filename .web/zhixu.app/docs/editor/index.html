      <h1 class="legal__title">编辑器方案（摘要）</h1>
      <p class="legal__meta">目标：稳定、细节一致、可扩展。</p>

      <article class="legal__content" aria-label="编辑器方案正文">
        <h2>设计目标</h2>
        <ul>
          <li>编辑与预览在同一份语义与渲染规则上保持一致。</li>
          <li>Markdown 渲染稳定，可离线使用。</li>
          <li>插件 Actions 能在编辑场景中低成本接入。</li>
        </ul>

        <h2>能力边界</h2>
        <ul>
          <li>“真数据”始终是 <code>docs/*.md</code> 文件本身。</li>
          <li>编辑器负责编辑体验与预览一致性，不把业务逻辑藏在 UI 里。</li>
          <li>任务语义通过文本规则表达，见 <a href="../tasks/">任务语法</a>。</li>
        </ul>
      </article>
