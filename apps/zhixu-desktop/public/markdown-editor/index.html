    <script>
      // Kotlin might call these before scripts finish loading; buffer and apply later.
      window.__payload = {
        themeJson: null,
        text: "",
        selStart: 0,
        selEnd: 0,
        mode: "live",
        fontSizePx: 16,
        placeholder: "",
        bottomInsetPx: 0,
        showLineNumbers: false,
        showProperties: true,
        readableLineLength: false,
        headerPath: "",
        canGoBack: false,
        canGoForward: false,
        showBacklinksInTab: false,
      };
      window.__applyQueued = false;
      window.__headerApplyQueued = false;
      window.__scheduleApply = () => {
        if (window.__applyQueued) return;
        window.__applyQueued = true;
        setTimeout(() => {
          window.__applyQueued = false;
          try {
            if (window.__apply) window.__apply();
          } catch (_) {}
          try {
            if (window.__applyExtras) window.__applyExtras();
          } catch (_) {}
        }, 0);
      };
      window.__scheduleHeaderApply = () => {
        if (window.__headerApplyQueued) return;
        window.__headerApplyQueued = true;
        setTimeout(() => {
          window.__headerApplyQueued = false;
          try {
            if (window.__applyHeader) window.__applyHeader();
          } catch (_) {}
        }, 0);
      };
      window.__applyExtras = () => {
        try {
          const payload = window.__payload || {};
          const editor = document.getElementById("editor");
          if (!editor || !editor.classList) return;
          editor.classList.toggle("cm-readable-line-length", !!payload.readableLineLength);
        } catch (_) {}
        try {
          if (window.__applyHeader) window.__applyHeader();
        } catch (_) {}
      };
      window.__setTheme = (json) => { window.__payload.themeJson = json; window.__scheduleApply(); };
      window.__setFontSize = (px) => { window.__payload.fontSizePx = Number(px) || 16; window.__scheduleApply(); };
      window.__setMode = (mode) => {
        // Switching mode might remove live-preview widgets. Ensure any focused inputs flush their value first.
        try {
          const el = document.activeElement;
          if (el && typeof el.blur === "function") el.blur();
        } catch (_) {}
        window.__payload.mode = mode === "source" ? "source" : "live";
        window.__scheduleApply();
      };
      window.__setPlaceholder = (s) => { window.__payload.placeholder = s || ""; window.__scheduleApply(); };
      window.__setShowLineNumbers = (v) => { window.__payload.showLineNumbers = !!v; window.__scheduleApply(); };
      window.__setShowProperties = (v) => { window.__payload.showProperties = (v !== false); window.__scheduleApply(); };
      window.__setReadableLineLength = (v) => { window.__payload.readableLineLength = !!v; window.__scheduleApply(); };
      window.__setHeaderPath = (path) => { window.__payload.headerPath = path || ""; window.__scheduleHeaderApply(); };
      window.__setNavState = (canGoBack, canGoForward) => {
        window.__payload.canGoBack = !!canGoBack;
        window.__payload.canGoForward = !!canGoForward;
        window.__scheduleHeaderApply();
      };
      window.__setShowBacklinksInTab = (v) => { window.__payload.showBacklinksInTab = !!v; window.__scheduleHeaderApply(); };
      window.__setBottomInset = (px) => {
        const v = Math.max(0, Number(px) || 0);
        window.__payload.bottomInsetPx = v;
        try { document.documentElement.style.setProperty("--editorBottomInset", v + "px"); } catch (e) {}
      };
      function __editorHasFocus() {
        try {
          const root = document.getElementById("editor");
          if (!root) return false;
          const active = document.activeElement;
          if (!active) return false;
          return active === root || root.contains(active);
        } catch (_) {
          return false;
        }
      }

      function __computeSafePreviewSelection(text, showProperties) {
        try {
          if (!text) return 0;

          // Skip UTF-8 BOM.
          let pos = text.charCodeAt(0) === 0xfeff ? 1 : 0;

          // If the doc starts with YAML frontmatter, jump past it so the widget stays intact.
          if (showProperties !== false) {
            const fenceCandidate = text.slice(pos, pos + 3);
            if (fenceCandidate === "---" || fenceCandidate === "+++") {
              const firstLineEnd = text.indexOf("\n", pos);
              const firstLine = (firstLineEnd === -1 ? text.slice(pos) : text.slice(pos, firstLineEnd)).trim();
              if (firstLine === fenceCandidate) {
                let scan = firstLineEnd === -1 ? text.length : firstLineEnd + 1;
                while (scan < text.length) {
                  const lineEnd = text.indexOf("\n", scan);
                  const end = lineEnd === -1 ? text.length : lineEnd;
                  const line = text.slice(scan, end).trim();
                  if (line === fenceCandidate) {
                    pos = end === text.length ? end : end + 1;
                    break;
                  }
                  scan = end === text.length ? end : end + 1;
                }
              }
            }
          }

          // Skip leading blank lines.
          while (pos < text.length) {
            const lineEnd = text.indexOf("\n", pos);
            const end = lineEnd === -1 ? text.length : lineEnd;
            const line = text.slice(pos, end);

            if (line.trim().length === 0) {
              pos = end === text.length ? end : end + 1;
              continue;
            }

            const patterns = [
              /^([ \t]*(?:>[ \t]*)+)/,
              /^(\s{0,3})(#{1,6})\s+/,
              /^([ \t]*)-\s+\[(?: |x|X)\]\s+/,
              /^([ \t]*)(?:[-*+])\s+/,
              /^([ \t]*)(?:\d+)\.\s+/,
              /^([ \t]*)(?:`{3,}|~{3,})/,
              /^!?\[/,
              /^([*_~`]{1,3})/,
            ];

            let advance = 0;
            for (let i = 0; i < patterns.length; i++) {
              const m = patterns[i].exec(line);
              if (m && m[0]) {
                advance = m[0].length + 1;
                break;
              }
            }
            if (!advance) advance = 4;
            return Math.min(pos + Math.min(advance, line.length), text.length);
          }

          return Math.min(pos, text.length);
        } catch (_) {
          return 0;
        }
      }

      window.__setDoc = (text, selStart, selEnd) => {
        const nextText = text || "";
        const start = Number(selStart) || 0;
        const end = Number(selEnd) || start;

        window.__payload.text = nextText;

        // Live preview: when opening a doc with selection at 0, CodeMirror's live-preview shows
        // the leading markdown marks (e.g. "#", "-", "---"). Keep the initial render unchanged
        // until the user clicks to place the caret.
        if (window.__payload.mode !== "source" && start === 0 && end === 0 && !__editorHasFocus()) {
          const safe = __computeSafePreviewSelection(nextText, window.__payload.showProperties);
          window.__payload.selStart = safe;
          window.__payload.selEnd = safe;
        } else {
          window.__payload.selStart = start;
          window.__payload.selEnd = end;
        }
        window.__scheduleApply();
      };
      window.__emitHeaderAction = (action, detail, ev) => {
        const info = {
          action: String(action || ""),
          detail: detail && typeof detail === "object" ? detail : {},
          ctrlKey: !!(ev && (ev.ctrlKey || ev.metaKey)),
          shiftKey: !!(ev && ev.shiftKey),
          altKey: !!(ev && ev.altKey),
        };
        try {
          if (typeof window.__onHeaderAction === "function") return window.__onHeaderAction(info);
        } catch (_) {}
        try {
          const api = window.ZhixuEditor;
          if (api && typeof api.headerAction === "function") return api.headerAction(info);
        } catch (_) {}
        try {
          if (window.parent && window.parent !== window) window.parent.postMessage({ type: "zhixu-md-editor-header", ...info }, "*");
        } catch (_) {}
      };

      // Keep __payload in sync with editor changes inside the iframe.
      // Otherwise __apply() (triggered by mode/theme/etc) can overwrite the live doc with stale __payload.text.
      (() => {
        let current = null;

        function wrapApi(api) {
          if (!api || typeof api !== "object") return api;
          try {
            if (api.__zhixuWrapped) return api;
            Object.defineProperty(api, "__zhixuWrapped", { value: true });
          } catch (_) {}

          const origDocChanged = api.docChanged;
          const origSelChanged = api.selectionChanged;

          if (typeof origDocChanged === "function") {
            api.docChanged = function (text, selStart, selEnd) {
              try {
                window.__payload.text = text || "";
                window.__payload.selStart = Number(selStart) || 0;
                window.__payload.selEnd = Number(selEnd) || window.__payload.selStart;
              } catch (_) {}
              return origDocChanged.apply(this, arguments);
            };
          }
          if (typeof origSelChanged === "function") {
            api.selectionChanged = function (selStart, selEnd) {
              try {
                window.__payload.selStart = Number(selStart) || 0;
                window.__payload.selEnd = Number(selEnd) || window.__payload.selStart;
              } catch (_) {}
              return origSelChanged.apply(this, arguments);
            };
          }
          return api;
        }

        Object.defineProperty(window, "ZhixuEditor", {
          configurable: true,
          get() {
            return current;
          },
          set(v) {
            current = wrapApi(v);
          },
        });
      })();
    </script>

    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const enabled = params.get("perf") === "1" || params.get("perf") === "true";
        if (!enabled) return;

        const PREFIX = "[zhixu-perf][md-editor]";
        const round1 = (n) => Math.round(n * 10) / 10;

        function percentile(sorted, p) {
          if (!sorted.length) return null;
          const idx = Math.max(0, Math.min(1, p)) * (sorted.length - 1);
          const lo = Math.floor(idx);
          const hi = Math.ceil(idx);
          if (lo === hi) return sorted[lo];
          const w = idx - lo;
          return sorted[lo] * (1 - w) + sorted[hi] * w;
        }

        function createRollingStats(maxSamples) {
          const max = Math.max(20, Number(maxSamples) || 200);
          const samples = [];
          let count = 0;
          let sum = 0;
          let min = Infinity;
          let maxSeen = 0;

          return {
            add(ms) {
              const v = Number(ms);
              if (!Number.isFinite(v)) return;
              const vv = Math.max(0, v);
              count += 1;
              sum += vv;
              min = Math.min(min, vv);
              maxSeen = Math.max(maxSeen, vv);
              samples.push(vv);
              if (samples.length > max) samples.splice(0, samples.length - max);
            },
            snapshot() {
              if (!count) return { count: 0, avgMs: null, minMs: null, p50Ms: null, p95Ms: null, maxMs: null };
              const sorted = samples.slice().sort((a, b) => a - b);
              return {
                count,
                avgMs: round1(sum / count),
                minMs: Number.isFinite(min) ? round1(min) : null,
                p50Ms: round1(percentile(sorted, 0.5)),
                p95Ms: round1(percentile(sorted, 0.95)),
                maxMs: Number.isFinite(maxSeen) ? round1(maxSeen) : null,
              };
            },
          };
        }

        const stats = {
          inputToFrame: createRollingStats(200),
          apply: createRollingStats(100),
        };

        try {
          window.__ZHIXU_PERF_MD__ = {
            enabled: true,
            stats,
            snapshot() {
              return { inputToFrame: stats.inputToFrame.snapshot(), apply: stats.apply.snapshot() };
            },
          };
        } catch (_) {}

        try {
          console.log(`${PREFIX} enabled`, { href: location.href, timeOrigin: performance.timeOrigin });
        } catch (_) {}

        try {
          const obs = new PerformanceObserver((list) => {
            for (const e of list.getEntries()) {
              if (e.duration < 80) continue;
              try {
                console.debug(`${PREFIX} longtask ${round1(e.duration)}ms`, { startTimeMs: round1(e.startTime), name: e.name });
              } catch (_) {}
            }
          });
          obs.observe({ type: "longtask", buffered: true });
        } catch (_) {}

        // Input -> next frame (rough proxy for "editing responsiveness").
        let inputPending = false;
        let lastInputAt = 0;
        document.addEventListener(
          "input",
          () => {
            lastInputAt = performance.now();
            if (inputPending) return;
            inputPending = true;
            requestAnimationFrame(() => {
              inputPending = false;
              const dt = performance.now() - lastInputAt;
              stats.inputToFrame.add(dt);
              if (dt >= 80) {
                try {
                  console.debug(`${PREFIX} slow input->frame ${round1(dt)}ms`);
                } catch (_) {}
              }
            });
          },
          true,
        );

        // Wrap __apply() to measure payload apply cost (mode/theme/doc changes).
        (() => {
          let current = null;
          Object.defineProperty(window, "__apply", {
            configurable: true,
            get() {
              return current;
            },
            set(fn) {
              if (typeof fn !== "function") {
                current = fn;
                return;
              }
              current = function () {
                const t0 = performance.now();
                try {
                  return fn.apply(this, arguments);
                } finally {
                  const dt = performance.now() - t0;
                  stats.apply.add(dt);
                  if (dt >= 80) {
                    try {
                      console.debug(`${PREFIX} slow __apply ${round1(dt)}ms`, { mode: window.__payload?.mode });
                    } catch (_) {}
                  }
                }
              };
            },
          });
        })();

        // Periodic summary (keeps console readable vs per-keystroke logs).
        let lastInputCount = 0;
        let lastApplyCount = 0;
        setInterval(() => {
          try {
            const inputSnap = stats.inputToFrame.snapshot();
            const applySnap = stats.apply.snapshot();
            if (inputSnap.count === lastInputCount && applySnap.count === lastApplyCount) return;
            lastInputCount = inputSnap.count;
            lastApplyCount = applySnap.count;
            console.debug(`${PREFIX} stats`, { inputToFrame: inputSnap, apply: applySnap });
          } catch (_) {}
        }, 5000);
      })();
    </script>

    <script>
      (() => {
        const queue = [];
        const params = new URLSearchParams(location.search);
        const fatalOverlayParam = (params.get("fatalOverlay") ?? "").toLowerCase();
        const showOverlay = fatalOverlayParam === "1" || fatalOverlayParam === "true";

        function ensureEl() {
          if (!showOverlay) return null;
          let el = document.getElementById("__fatal");
          if (el) return el;
          el = document.createElement("pre");
          el.id = "__fatal";
          el.style.cssText =
            "position:fixed;left:8px;right:8px;bottom:8px;max-height:45vh;overflow:auto;z-index:2147483647;" +
            "padding:10px 12px;border-radius:12px;border:1px solid rgba(255,0,0,.35);" +
            "background:rgba(30,0,0,.88);color:#fff;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;" +
            "white-space:pre-wrap;word-break:break-word;display:none";
          (document.body || document.documentElement).appendChild(el);
          return el;
        }
        function show(title, err) {
          try {
            const msg =
              typeof err === "string"
                ? err
                : err && err.stack
                  ? err.stack
                  : err && err.message
                    ? err.message
                    : String(err);
            const entry = "[" + new Date().toISOString() + "] " + title + "\n" + msg + "\n";
            queue.push(entry);
            if (queue.length > 30) queue.splice(0, queue.length - 30);

            try {
              console.error(entry);
            } catch (_) {}

            try {
              window.__fatalQueue = queue;
            } catch (_) {}

            const el = ensureEl();
            if (!el) return;
            el.textContent = queue.join("\n");
            el.style.display = "block";
          } catch (_) {}
        }
        window.__showFatal = show;
        window.addEventListener(
          "error",
          (e) => {
            // Ignore resource-load errors for inline images (these are common and not fatal).
            try {
              const t = e && e.target;
              if (t && t.tagName === "IMG") return;
            } catch (_) {}
            show("error", (e && (e.error || e.message)) || e);
          },
          true
        );
        window.addEventListener(
          "unhandledrejection",
          (e) => {
            show("unhandledrejection", e.reason || e);
          },
          true
        );

        // Visible breadcrumb: confirm JS actually runs.
        try {
          const boot = document.getElementById("__plainBoot");
          if (boot) boot.textContent = "JS running...";
        } catch (_) {}
      })();
    </script>

    <style>
      * { box-sizing: border-box; }
      :root {
        --surface: #FFFFFF;
        --onSurface: #111111;
        --outline: rgba(0, 0, 0, 0.18);
        --primary: #2F6FEB;
        --editorFont: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, "PingFang SC",

    <script>
      (() => {
        const backBtn = document.getElementById("zhixuHeaderBack");
        const forwardBtn = document.getElementById("zhixuHeaderForward");
        const foldersEl = document.getElementById("zhixuBreadcrumbFolders");
        const sepEl = document.getElementById("zhixuBreadcrumbSep");
        const fileBtn = document.getElementById("zhixuBreadcrumbFile");
        const renameInput = document.getElementById("zhixuFileRenameInput");
        const placeholderEl = document.getElementById("zhixuBreadcrumbPlaceholder");
        const modeBtn = document.getElementById("zhixuHeaderModeToggle");
        const bookIcon = document.getElementById("zhixuModeIconBook");
        const penIcon = document.getElementById("zhixuModeIconPen");
        const moreBtn = document.getElementById("zhixuHeaderMoreBtn");
        const menu = document.getElementById("zhixuHeaderMenu");

        if (!foldersEl || !fileBtn || !renameInput) return;

        let isRenaming = false;
        let last = { headerPath: null, mode: null, canGoBack: null, canGoForward: null, showBacklinksInTab: null, isRenaming: null };
        let lastParts = [];

        function getPayload() {
          return window.__payload || {};
        }

        // Optional: allow passing a path via URL (useful for dev preview/testing).
        try {
          const p = getPayload();
          if (!p.headerPath) {
            const pathParam = new URLSearchParams(location.search).get("path");
            if (pathParam) p.headerPath = pathParam;
          }
        } catch (_) {}

        function normalizePath(raw) {
          const s = String(raw || "").trim().replace(/\\/g, "/");
          const cleaned = s.replace(/^\/+/, "").replace(/\/+$/, "").replace(/\/+/g, "/");
          const parts = cleaned ? cleaned.split("/").filter(Boolean) : [];
          return { cleaned, parts };
        }

        function setMenuOpen(open) {
          if (!menu || !moreBtn) return;
          menu.hidden = !open;
          try {
            moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
          } catch (_) {}
        }

        function isMenuOpen() {
          return !!menu && !menu.hidden;
        }

        function ensureSeparatorBetweenFolders() {
          // Folder separators are created dynamically inside foldersEl; nothing to do here.
        }

        function renderFolders(folderParts) {
          foldersEl.textContent = "";
          for (let i = 0; i < folderParts.length; i++) {
            const name = folderParts[i];
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "zhixuCrumb";
            btn.textContent = name;
            btn.dataset.kind = "folder";
            btn.dataset.path = folderParts.slice(0, i + 1).join("/");
            foldersEl.appendChild(btn);

            if (i !== folderParts.length - 1) {
              const sep = document.createElement("span");
              sep.className = "zhixuCrumbSep";
              sep.textContent = "/";
              foldersEl.appendChild(sep);
            }
          }
        }

        function setCheck(name, checked) {
          if (!menu) return;
          const el = menu.querySelector(`[data-check=\"${name}\"]`);
          if (!el) return;
          el.hidden = !checked;
        }

        function applyHeader() {
          try {
            const p = getPayload();
            const canBack = !!p.canGoBack;
            const canForward = !!p.canGoForward;
            if (backBtn) backBtn.disabled = !canBack;
            if (forwardBtn) forwardBtn.disabled = !canForward;

            const mode = p.mode === "source" ? "source" : "live";
            const currentView = mode === "source" ? "编辑视图" : "阅读视图";
            const nextView = mode === "source" ? "阅读视图" : "编辑视图";
            const nextMode = mode === "source" ? "live" : "source";

            if (modeBtn) {
              modeBtn.dataset.nextMode = nextMode;
              modeBtn.title = `该标签页处于${currentView}中\n点击此处切换至${nextView}\nCtrl+单击以在新标签页中打开`;
            }
            if (bookIcon) bookIcon.hidden = nextMode !== "live";
            if (penIcon) penIcon.hidden = nextMode !== "source";

            const headerPath = String(p.headerPath || "").trim();
            const showBacklinksInTab = !!p.showBacklinksInTab;

            if (
              headerPath !== last.headerPath ||
              mode !== last.mode ||
              canBack !== last.canGoBack ||
              canForward !== last.canGoForward ||
              showBacklinksInTab !== last.showBacklinksInTab ||
              isRenaming !== last.isRenaming
            ) {
              const { parts } = normalizePath(headerPath);
              lastParts = parts;

              const folders = parts.length > 1 ? parts.slice(0, -1) : [];
              const file = parts.length ? parts[parts.length - 1] : "";

              renderFolders(folders);

              if (sepEl) sepEl.hidden = folders.length === 0 || (!file && !isRenaming);

              if (!isRenaming) {
                fileBtn.hidden = !file;
                fileBtn.textContent = file || "";
              }

              if (placeholderEl) placeholderEl.hidden = !!file || folders.length > 0 || isRenaming;

              setCheck("backlinks", showBacklinksInTab);
              setCheck("mode-live", mode === "live");
              setCheck("mode-source", mode === "source");

              last = { headerPath, mode, canGoBack: canBack, canGoForward: canForward, showBacklinksInTab, isRenaming };
            }
          } catch (_) {}
        }

        window.__applyHeader = applyHeader;

        function emit(action, detail, ev) {
          try {
            if (typeof window.__emitHeaderAction === "function") window.__emitHeaderAction(action, detail, ev);
          } catch (_) {}
        }

        function enterRename() {
          if (isRenaming) return;
          const p = getPayload();
          const headerPath = String(p.headerPath || "").trim();
          const { parts } = normalizePath(headerPath);
          const currentName = parts.length ? parts[parts.length - 1] : fileBtn.textContent || "";
          if (!currentName) return;

          isRenaming = true;
          try { document.body.classList.add("zhixuHeaderRenaming"); } catch (_) {}
          try { setMenuOpen(false); } catch (_) {}

          fileBtn.hidden = true;
          if (sepEl) sepEl.hidden = parts.length <= 1;
          if (placeholderEl) placeholderEl.hidden = true;
          renameInput.hidden = false;
          renameInput.value = currentName;
          try {
            renameInput.focus();
            renameInput.select();
          } catch (_) {}
        }

        function exitRename(commit, ev) {
          if (!isRenaming) return;
          const nextName = String(renameInput.value || "").trim();

          renameInput.hidden = true;
          fileBtn.hidden = false;
          isRenaming = false;
          try { document.body.classList.remove("zhixuHeaderRenaming"); } catch (_) {}

          if (!nextName) {
            applyHeader();
            return;
          }

          const currentName = fileBtn.textContent || "";
          if (nextName !== currentName) {
            // Optimistically update the headerPath; host can overwrite by calling __setHeaderPath again.
            if (lastParts && lastParts.length) {
              const parts = lastParts.slice(0);
              parts[parts.length - 1] = nextName;
              try {
                window.__payload.headerPath = parts.join("/");
              } catch (_) {}
            }
            fileBtn.textContent = nextName;
            emit("renameFile", { name: nextName }, ev || null);
          }

          applyHeader();
        }

        // Left nav buttons.
        if (backBtn) {
          backBtn.addEventListener("click", (ev) => {
            try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}
            emit("navigateBack", {}, ev);
          });
        }
        if (forwardBtn) {
          forwardBtn.addEventListener("click", (ev) => {
            try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}
            emit("navigateForward", {}, ev);
          });
        }

        // Breadcrumb clicks.
        foldersEl.addEventListener("click", (ev) => {
          const t = ev.target;
          const btn = t && t.closest ? t.closest("button[data-kind=\"folder\"]") : null;
          if (!btn) return;
          try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}
          const path = btn.dataset.path || "";
          emit("revealFolder", { path }, ev);
        });
        fileBtn.addEventListener("click", (ev) => {
          try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}
          enterRename();
        });

        // Rename input.
        renameInput.addEventListener("keydown", (ev) => {
          try { ev.stopPropagation(); } catch (_) {}
          if (ev.key === "Enter") {
            try { ev.preventDefault(); } catch (_) {}
            exitRename(true, ev);
          } else if (ev.key === "Escape") {
            try { ev.preventDefault(); } catch (_) {}
            // Cancel.
            renameInput.hidden = true;
            isRenaming = false;
            try { document.body.classList.remove("zhixuHeaderRenaming"); } catch (_) {}
            applyHeader();
            try { document.getElementById("editor")?.focus?.(); } catch (_) {}
          }
        });
        renameInput.addEventListener("blur", (ev) => exitRename(true, ev));

        // Mode toggle.
        if (modeBtn) {
          modeBtn.addEventListener("click", (ev) => {
            try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}
            const p = getPayload();
            const mode = p.mode === "source" ? "source" : "live";
            const nextMode = mode === "source" ? "live" : "source";
            const openInNewTab = !!(ev.ctrlKey || ev.metaKey);

            emit("toggleMode", { from: mode, to: nextMode, openInNewTab }, ev);
            if (!openInNewTab && typeof window.__setMode === "function") window.__setMode(nextMode);
            setMenuOpen(false);
          });
        }

        // Menu open/close + actions.
        if (moreBtn && menu) {
          moreBtn.addEventListener("click", (ev) => {
            try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}
            setMenuOpen(!isMenuOpen());
          });
          document.addEventListener(
            "pointerdown",
            (ev) => {
              if (!isMenuOpen()) return;
              const target = ev.target;
              if (menu.contains(target) || moreBtn.contains(target)) return;
              setMenuOpen(false);
            },
            true,
          );
          document.addEventListener(
            "keydown",
            (ev) => {
              if (!isMenuOpen()) return;
              if (ev.key === "Escape") setMenuOpen(false);
            },
            true,
          );

          async function copyText(text) {
            const s = String(text || "");
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(s);
                return true;
              }
            } catch (_) {}
            try {
              const ta = document.createElement("textarea");
              ta.value = s;
              ta.setAttribute("readonly", "true");
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              ta.style.left = "-9999px";
              ta.style.top = "0";
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
              return true;
            } catch (_) {}
            return false;
          }

          menu.addEventListener("click", (ev) => {
            const t = ev.target;
            const item = t && t.closest ? t.closest("button[data-action]") : null;
            if (!item) return;
            try { ev.preventDefault(); ev.stopPropagation(); } catch (_) {}

            const action = item.dataset.action || "";
            const openInNewTab = !!(ev.ctrlKey || ev.metaKey);

            if (action === "setMode") {
              const targetMode = item.dataset.mode === "source" ? "source" : "live";
              emit("setMode", { mode: targetMode, openInNewTab }, ev);
              if (!openInNewTab && typeof window.__setMode === "function") window.__setMode(targetMode);
              setMenuOpen(false);
              return;
            }

            if (action === "toggleBacklinksInTab") {
              const next = !getPayload().showBacklinksInTab;
              try { window.__payload.showBacklinksInTab = next; } catch (_) {}
              emit("toggleBacklinksInTab", { enabled: next }, ev);
              applyHeader();
              setMenuOpen(false);
              return;
            }

            if (action === "rename") {
              setMenuOpen(false);
              enterRename();
              return;
            }

            if (action === "copyPath" || action === "copyRelativePath") {
              const headerPath = String(getPayload().headerPath || "");
              copyText(headerPath);
              emit(action, { text: headerPath }, ev);
              setMenuOpen(false);
              return;
            }

            emit(action, {}, ev);
            setMenuOpen(false);
          });
        }

        // Initial paint.
        try { applyHeader(); } catch (_) {}
        try { if (typeof window.__scheduleHeaderApply === "function") window.__scheduleHeaderApply(); } catch (_) {}
      })();
    </script>
    <script
      src="./codemirror.bundle.js"

    <script>
      // Draw a custom caret overlay for consistent thickness/styling.
      (function () {
        var caretEl = null;
        var raf = 0;
        var showing = false;

        var BLINK_VISIBLE_MS = 550;
        var BLINK_HIDDEN_MS = 550;
        var BLINK_IDLE_DELAY_MS = 400; // 300~500ms

        var blinkTimer = 0;
        var blinkIdleTimer = 0;
        var blinking = false;
        var caretVisible = true;
        var pauseBlinkUntil = 0;

        function clearTimers() {
          if (blinkTimer) {
            clearTimeout(blinkTimer);
            blinkTimer = 0;
          }
          if (blinkIdleTimer) {
            clearTimeout(blinkIdleTimer);
            blinkIdleTimer = 0;
          }
        }

        function setOpacity(isVisible) {
          var el = ensureCaret();
          caretVisible = !!isVisible;
          el.style.opacity = caretVisible ? "1" : "0";
        }

        function stopBlink() {
          blinking = false;
          if (blinkTimer) {
            clearTimeout(blinkTimer);
            blinkTimer = 0;
          }
          setOpacity(true);
        }

        function scheduleNextToggle(ms) {
          if (!blinking) return;
          if (blinkTimer) clearTimeout(blinkTimer);
          blinkTimer = setTimeout(function () {
            if (!blinking) return;
            caretVisible = !caretVisible;
            setOpacity(caretVisible);
            scheduleNextToggle(caretVisible ? BLINK_VISIBLE_MS : BLINK_HIDDEN_MS);
          }, ms);
        }

        function startBlinkNow() {
          if (!showing) return;
          blinking = true;
          setOpacity(true);
          scheduleNextToggle(BLINK_VISIBLE_MS);
        }

        function delayBlinkFromNow(ms) {
          if (blinkIdleTimer) clearTimeout(blinkIdleTimer);
          blinkIdleTimer = setTimeout(function () {
            blinkIdleTimer = 0;
            if (!showing) return;
            startBlinkNow();
          }, ms);
        }

        function touchCaret(reason) {
          if (!showing) return;
          var now = Date.now();
          setOpacity(true);

          if (now < pauseBlinkUntil) {
            stopBlink();
            delayBlinkFromNow(Math.max(0, pauseBlinkUntil - now));
            return;
          }

          // Restart blinking so the caret is visible immediately.
          clearTimers();
          startBlinkNow();
        }

        function onUserInput() {
          if (!showing) return;
          pauseBlinkUntil = Date.now() + BLINK_IDLE_DELAY_MS;
          setOpacity(true);
          stopBlink();
          delayBlinkFromNow(BLINK_IDLE_DELAY_MS);
        }

        function ensureCaret() {
          if (caretEl) return caretEl;
          caretEl = document.createElement("div");
          caretEl.id = "zhixuCaret";
          caretEl.style.opacity = "1";
          (document.body || document.documentElement).appendChild(caretEl);
          return caretEl;
        }

        function isInEditor(node) {
          var editor = document.getElementById("editor");
          if (!editor || !node) return false;
          var el = node.nodeType === 1 ? node : node.parentNode;
          return el && (el === editor || editor.contains(el));
        }

        function closestCmLine(node) {
          var editor = document.getElementById("editor");
          if (!editor || !node) return null;
          var el = node.nodeType === 1 ? node : node.parentNode;
          while (el && el !== editor) {
            try {
              if (el.classList && el.classList.contains("cm-line")) return el;

        function pickCaretRect(editor, sel, range) {
          try {
            var rects = range && range.getClientRects ? range.getClientRects() : null;
            if (rects && rects.length) {
              var r0 = rects[0];
              if (r0 && isFinite(r0.left) && isFinite(r0.top) && r0.height > 0) {
                return { left: r0.left, top: r0.top, height: r0.height, kind: "range" };
              }
            }
          } catch (_) {}

          try {
            var rb = range && range.getBoundingClientRect ? range.getBoundingClientRect() : null;
            if (rb && isFinite(rb.left) && isFinite(rb.top) && rb.height > 0) {
              return { left: rb.left, top: rb.top, height: rb.height, kind: "bbox" };
            }
          } catch (_) {}

          // Fallback: empty/blank line often yields no selection rects. Use the current line box.
          try {
            var line = closestCmLine(sel && sel.anchorNode);
            if (line) {
              var lr = line.getBoundingClientRect();
              if (lr && isFinite(lr.left) && isFinite(lr.top) && lr.height > 0) {
                return { left: lr.left, top: lr.top, height: lr.height, kind: "line" };
              }
            }
          } catch (_) {}

          // Last resort: use content box + its padding as the start position.
          try {
            var content = editor && editor.querySelector ? editor.querySelector(".cm-content") : null;
            if (content) {
              var cr = content.getBoundingClientRect();
              var cs = window.getComputedStyle ? getComputedStyle(content) : null;
              var pl = cs ? parseFloat(cs.paddingLeft || "0") : 0;
              var lh = cs ? parseFloat(cs.lineHeight || "18") : 18;
              if (cr && isFinite(cr.left) && isFinite(cr.top) && cr.height > 0) {
                return {
                  left: cr.left + (isFinite(pl) ? pl : 0),
                  top: cr.top,
                  height: isFinite(lh) && lh > 0 ? lh : 18,
                  kind: "content",
                };
              }
            }
          } catch (_) {}

          return null;
        }

        function hide() {
          var el = ensureCaret();
          el.style.display = "none";
          showing = false;
          pauseBlinkUntil = 0;
          clearTimers();
          blinking = false;
        }

        function update() {
          raf = 0;
          try {
            var editor = document.getElementById("editor");
            if (!editor) return hide();
            var active = document.activeElement;
            if (!active || !(active === editor || editor.contains(active))) return hide();

            var sel = document.getSelection ? document.getSelection() : null;
            if (!sel || sel.rangeCount === 0 || !sel.isCollapsed) return hide();
            if (!isInEditor(sel.anchorNode)) return hide();

            var range = sel.getRangeAt(0);
            var rect = pickCaretRect(editor, sel, range);
            if (!rect || !isFinite(rect.left) || !isFinite(rect.top) || rect.height <= 0) return hide();

            var el = ensureCaret();
            el.style.display = "block";
            if (!showing) {
              showing = true;
              touchCaret("show");
            }
            var dpr = window.devicePixelRatio || 1;
            var snap = function (v) {
              return Math.round(v * dpr) / dpr;
            };
            var left = snap(rect.left);
            var h = Math.max(18, rect.height);
            var top = rect.top;
            if (rect.kind === "line" || rect.kind === "content") {
              // For empty lines, the line box can be taller than the caret; shrink a bit and center.
              h = Math.max(16, h - 4);
              top = top + 2;
            }
            el.style.left = left + "px";
            el.style.top = snap(top) + "px";
            // Use a fixed device-pixel width for consistent perceived thickness across DPI scales.
            el.style.width = 2 / dpr + "px";
            el.style.height = snap(h) + "px";
          } catch (_) {
            hide();
          }
        }

        function schedule() {
          if (raf) return;
          raf = requestAnimationFrame(update);
        }

        document.addEventListener(
          "selectionchange",
          function () {
            schedule();
            touchCaret("selectionchange");
          },
          true
        );
        document.addEventListener(
          "input",
          function () {
            schedule();
            onUserInput();
          },
          true
        );
        document.addEventListener(
          "keydown",
          function () {
            schedule();
            touchCaret("keydown");
          },
          true
        );
        document.addEventListener(
          "keyup",
          function () {
            schedule();
            touchCaret("keyup");
          },
          true
        );
        document.addEventListener(
          "pointerdown",
          function () {
            schedule();
            touchCaret("pointerdown");
          },
          true
        );
        document.addEventListener("pointerup", schedule, true);
        document.addEventListener("click", schedule, true);
        document.addEventListener(
          "focusin",
          function () {
            schedule();
            touchCaret("focusin");
          },
          true
        );
        document.addEventListener(
          "focusout",
          function () {
            schedule();
          },
          true
        );
        window.addEventListener("scroll", schedule, true);
        window.addEventListener("resize", schedule, true);
        schedule();
      })();
    </script>
    <script>
      (function () {
        function rewriteImg(img) {
          try {
            if (!img || img.tagName !== "IMG") return;
            var raw = img.getAttribute("src") || "";
            if (!raw) return;
            if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw)) return;
            if (raw.indexOf("/vault/") === 0) return;
            if (raw.indexOf("./") === 0) raw = raw.slice(2);
            if (raw.indexOf(".zhixu/") === 0) img.setAttribute("src", "/vault/" + raw);
          } catch (_) {}
        }

        function scan(root) {
          try {
            if (!root) return;
            if (root.tagName === "IMG") rewriteImg(root);
            var imgs = root.querySelectorAll ? root.querySelectorAll("img.cm-lp-image") : [];
            for (var i = 0; i < imgs.length; i++) rewriteImg(imgs[i]);
          } catch (_) {}
        }

        var editor = document.getElementById("editor") || document.body;
        if (!editor) return;
        scan(editor);
        try {
          var obs = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var m = mutations[i];
              if (m.type === "attributes" && m.attributeName === "src") {
                rewriteImg(m.target);
              } else if (m.addedNodes && m.addedNodes.length) {
                for (var j = 0; j < m.addedNodes.length; j++) scan(m.addedNodes[j]);
              }
            }
          });
          obs.observe(editor, { subtree: true, childList: true, attributes: true, attributeFilter: ["src"] });
        } catch (_) {}
      })();
    </script>
  </body>
