    <link rel="stylesheet" crossorigin href="/assets/index-CIiWJbFI.css">
    <style>
      /* Tab strip + editor fusion (match screenshot) */
      .topbar {
        --tabbar-bg: #f8f8f8 !important;
        background: var(--tabbar-bg) !important;
        border-bottom: none !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }

      .tabs {
        gap: 0 !important;
        padding-bottom: 4px !important;
        box-sizing: border-box !important;
      }

      .tab {
        position: relative !important;
      }

      .tabInner {
        padding: 0 10px !important;
        border: 1px solid transparent !important;
        border-radius: 10px !important;
        background: transparent !important;
        height: 30px !important;
        margin: 0 !important;
        overflow: visible !important;
      }

      .tabInner > * {
        position: relative !important;
        z-index: 1 !important;
      }

      .tab:not(.active):hover .tabInner::after {
        content: "" !important;
        position: absolute !important;
        inset: 0 4px !important;
        background: #eee !important;
        border-radius: 4px !important;
        pointer-events: none !important;
        z-index: 0 !important;
      }

      /* divider lines between tabs */
      .tab:not(:first-child)::before {
        content: none !important;
        display: none !important;
      }

      .tab:not(:first-child) .tabInner::before {
        content: "" !important;
        position: absolute !important;
        left: 0 !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 2px !important;
        height: 22px !important;
        background: rgba(0, 0, 0, 0.18) !important;
        border-radius: 0 !important;
        z-index: 1 !important;
      }

      .tab.active .tabInner::before,
      .tab.active + .tab .tabInner::before {
        opacity: 0 !important;
      }

      .tab.active .tabInner {
        background: var(--bg) !important;
        border-color: rgba(0, 0, 0, 0.12) !important;
        border-bottom-color: transparent !important;
        border-radius: 4px 4px 0 0 !important;
        margin: 0 !important;
        height: 30px !important;
      }

      .tab.active .tabInner::after {
        content: "" !important;
        position: absolute !important;
        left: 0 !important;
        right: 0 !important;
        bottom: -4px !important;
        height: 4px !important;
        background: var(--bg) !important;
        pointer-events: none !important;
        z-index: 0 !important;
      }

      .tabClose {
        opacity: 1 !important;
        transition: opacity 120ms ease !important;
      }

      .tab:not(.active):not([data-dirty="true"]) .tabClose {
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .tab:hover .tabClose,
      .tab:focus-within .tabClose,
      .tab.active .tabClose,
      .tab[data-dirty="true"] .tabClose {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    </style>
  </head>

    <div id="root"></div>
