<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zhixu</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: rgba(0, 0, 0, 0.88);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue",
          Arial, "Noto Sans", "Liberation Sans", sans-serif;
        overflow: hidden;
      }

      #root {
        height: 100%;
      }

      /* Startup splash: render before JS/React to avoid white-screen. */
      #zhixu-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(245, 245, 245, 0.82);
        backdrop-filter: blur(10px);
        opacity: 1;
      }

      #zhixu-boot-splash[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      #zhixu-boot-splash .zhixuBootCard {
        width: min(520px, calc(100vw - 32px));
        height: min(360px, calc(100vh - 32px));
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.12),
          0 1px 0 rgba(255, 255, 255, 0.65) inset;
        padding: 14px 14px 12px;
      }

      #zhixu-boot-splash .zhixuBootBrand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      #zhixu-boot-splash .zhixuBootLogoImg {
        width: 34px;
        height: 34px;
        border-radius: 4px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        flex: 0 0 auto;
      }

      #zhixu-boot-splash .zhixuBootTitle {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: rgba(0, 0, 0, 0.88);
      }

      #zhixu-boot-splash .zhixuBootSubtitle {
        margin-top: 2px;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.55);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #zhixu-boot-splash .zhixuBootLog {
        min-height: 0;
        margin: 0;
        padding: 10px 10px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: #0b0f14;
        color: rgba(255, 255, 255, 0.88);
        font:
          12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        white-space: pre-wrap;
        overflow: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        #zhixu-boot-splash[data-hidden="true"] {
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CtGYas8j.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BC6laj8u.css">
  </head>
  <body>
    <div id="zhixu-boot-splash" role="status" aria-live="polite" aria-label="Zhixu starting">
      <div class="zhixuBootCard">
        <div class="zhixuBootBrand">
          <img class="zhixuBootLogoImg" src="/app-icon.png" alt="" />
          <div style="min-width: 0">
            <div class="zhixuBootTitle">Zhixu</div>
            <div id="zhixu-boot-step" class="zhixuBootSubtitle">Starting...</div>
          </div>
        </div>
        <pre id="zhixu-boot-log" class="zhixuBootLog"></pre>
      </div>
    </div>

    <script>
      try {
        performance.mark("shell:visible");
      } catch (_) {}
    </script>
    <script>
      (function () {
        const MAX_LINES = 260;
        const lines = [];

        function getLogEl() {
          return document.getElementById("zhixu-boot-log");
        }

        function getStepEl() {
          return document.getElementById("zhixu-boot-step");
        }

        function render() {
          const el = getLogEl();
          if (!el) return;
          el.textContent = lines.join("\n");
          el.scrollTop = el.scrollHeight;
        }

        function append(raw) {
          const line = String(raw ?? "");
          lines.push(line);
          if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
          render();
        }

        function step(text) {
          const el = getStepEl();
          if (!el) return;
          el.textContent = String(text ?? "");
        }

        window.__zhixuBoot = { log: append, step };

        step("Loading UI...");
        append("$ boot");
        document.addEventListener("DOMContentLoaded", () => append("$ dom:ready"));
        window.addEventListener("error", (e) => append(`! error: ${e.message || e.type}`));
        window.addEventListener("unhandledrejection", (e) =>
          append(`! unhandled: ${String(e.reason ?? "unknown")}`),
        );
      })();
    </script>

    <div id="root"></div>
  </body>
</html>
